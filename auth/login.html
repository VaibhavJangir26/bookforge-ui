<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGN IN // BOOKFORGE PLATFORM</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body style="background: var(--bg-warm);">

  <!-- Global Loader -->
  <div id="global-loader" class="loader-overlay">
    <div class="vintage-spinner"></div>
    <div class="loader-text" id="loader-text">AUTHENTICATING...</div>
  </div>

  <!-- Header -->
  <header class="vintage-nav">
    <div class="container nav-inner">
      <a href="../index.html" class="brand-logo">
        BOOK<span class="logo-accent">FORGE</span>
      </a>
      <div class="nav-links">
        <a href="../index.html" class="nav-link-item">Home</a>
        <a href="signup.html" class="btn btn-sm btn-outline btn-pill">Register</a>
      </div>
    </div>
  </header>

  <!-- Login Main -->
  <main class="container" style="max-width: 520px; margin-top: 3.5rem; margin-bottom: 4rem;">
    
    <div class="card" style="padding: 2.5rem; border-radius: var(--radius-xs); border: var(--border-light); box-shadow: var(--shadow-hover);">
      
      <div style="text-align: center; margin-bottom: 2rem;">
        <span class="badge badge-rust mb-1">SECURITY GATEWAY</span>
        <h1 style="font-size: 2.4rem; font-family: var(--font-serif); margin-top: 0.5rem;">SIGN IN</h1>
        <p style="font-size: 0.92rem; color: var(--text-muted);">Enter your username and passphrase to access your console.</p>
      </div>

      <div id="alert-container"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label">OPERATOR USERNAME</label>
          <input type="text" id="login-username" class="form-input" placeholder="e.g. admin, ram123, shyam123" required autofocus>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
            <label class="form-label" style="margin-bottom: 0;">PASSPHRASE</label>
            <a href="#" style="font-size: 0.8rem; color: var(--text-muted); text-decoration: underline;">Forgot passphrase?</a>
          </div>
          <input type="password" id="login-password" class="form-input" placeholder="••••••••••••" required>
        </div>

        <button type="submit" class="btn btn-rust btn-block btn-pill mb-3" style="font-size: 0.95rem; padding: 0.85rem;">
          Authorize Session ➔
        </button>
      </form>

      <!-- Instant Demo Seeds (For Developer Testing) -->
      <div style="border-top: var(--border-light); padding-top: 1.5rem; margin-top: 1.5rem;">
        <span style="font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); display: block; margin-bottom: 0.75rem;">
          ⚡ Developer 1-Click Role Testing:
        </span>

        <div style="display: flex; flex-direction: column; gap: 0.6rem;">
          <button type="button" onclick="fillAndLogin('admin')" class="btn btn-outline btn-sm" style="justify-content: space-between; border-radius: var(--radius-xs); background: #FAF7F2;">
            <span>👑 <strong>ADMIN (Owner):</strong> admin</span>
            <span class="text-rust">LOGIN ↵</span>
          </button>
          <button type="button" onclick="fillAndLogin('provider')" class="btn btn-outline btn-sm" style="justify-content: space-between; border-radius: var(--radius-xs); background: #FAF7F2;">
            <span>🏢 <strong>PROVIDER (Host):</strong> ram123</span>
            <span class="text-rust">LOGIN ↵</span>
          </button>
          <button type="button" onclick="fillAndLogin('customer')" class="btn btn-outline btn-sm" style="justify-content: space-between; border-radius: var(--radius-xs); background: #FAF7F2;">
            <span>👤 <strong>CUSTOMER (Guest):</strong> shyam123</span>
            <span class="text-rust">LOGIN ↵</span>
          </button>
        </div>
      </div>

      <div class="mt-3 text-center" style="font-size: 0.88rem; color: var(--text-muted);">
        Don't have an account yet? <a href="signup.html" style="color: var(--accent-rust); text-decoration: underline; font-weight: 600;">Register here</a>
      </div>

    </div>

  </main>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        await AuthAPI.login({ username, password });
        showToast('Authentication approved! Navigating to console...', 'success');
        setTimeout(() => {
          Auth.redirectBasedOnRole();
        }, 400);
      } catch (err) {
        showToast(err.message || 'Invalid username or password', 'error');
      }
    });

    async function fillAndLogin(roleKey) {
      const seed = SeedUsers[roleKey];
      if (!seed) return;
      document.getElementById('login-username').value = seed.username;
      document.getElementById('login-password').value = seed.password;
      await quickLoginAs(roleKey);
    }
  </script>
</body>
</html>
